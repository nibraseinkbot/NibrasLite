[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nibraslite"
version = "0.1.5"
description = "A lightweight Selenium 4 helper providing persistent sessions and simple stealth options."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "nibras", email = "einkbot4@gmail.com"}]
keywords = ["selenium", "browser", "automation", "stealth", "persistent-session"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "selenium>=4.48",
    "undetected-chromedriver>=3.5.0; extra == \"stealth\"",
]
[project.optional-dependencies]
stealth = ["undetected-chromedriver>=3.5.0"]

[project.urls]
Homepage = "https://github.com/nibraseinkbot/NibrasLite"
Repository = "https://github.com/nibraseinkbot/NibrasLite.git"

[project.scripts]
nibraslite = "nibraslite.browser:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nibraslite*"]
